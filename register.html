<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta | Comparador Financeiro</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Crie sua conta</h1>
        <p>Registre-se para ter um painel financeiro personalizado.</p>
        <form id="register-form">
          <label>
            Nome
            <input type="text" name="name" placeholder="Seu nome" required />
          </label>
          <label>
            E-mail
            <input type="email" name="email" placeholder="voce@empresa.com" required />
          </label>
          <label>
            Senha
            <input
              type="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              required
            />
          </label>
          <button class="primary-button" type="submit">Criar conta</button>
        </form>
        <p class="auth-footer">
          Já tem conta?
          <a href="/login">Entrar</a>
        </p>
      </div>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
